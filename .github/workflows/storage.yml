name: Storage CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # MinIO no longer publishes container images, so the S3-compatible test
      # server is Versity Gateway with its POSIX backend. Credentials are
      # test-only defaults for a throwaway container; the test creates the bucket.
      - name: Start Versity S3 gateway
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          docker run -d --name s3 -p 9000:9000 -v "$RUNNER_TEMP/s3:/data" \
            -e ROOT_ACCESS_KEY=golar-test -e ROOT_SECRET_KEY=golar-test-secret \
            versity/versitygw:latest --port :9000 posix /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done
          docker logs s3
      - run: go test -race -run 'TestS3Integration|TestS3|TestLocal' -v ./storage/...
        env:
          GOLAR_TEST_S3_ENDPOINT: http://localhost:9000
          GOLAR_TEST_S3_BUCKET: golar-test
          GOLAR_TEST_S3_KEY: golar-test
          GOLAR_TEST_S3_SECRET: golar-test-secret
