name: Vulnerability scan
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch vulnerabilities published since the last push
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "website"]
    steps:
      - uses: actions/checkout@v7
      # go.mod sets the minimum version, 1.27.0. Scan with the latest 1.27
      # patch release instead, which is what applications should build with,
      # so fixed standard library vulnerabilities do not fail the scan.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
