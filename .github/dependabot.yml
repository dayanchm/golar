version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/website"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  # Versions golar new writes into generated frontends; see
  # internal/scaffold/npm/package.json.
  - package-ecosystem: npm
    directory: "/internal/scaffold/npm"
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "chore(scaffold)"
